name: "Minecraft Paper + Geyser (Java & Bedrock)"
slug: minecraft_paper_geyser_server
description: >
  Paper Minecraft server with Geyser and Floodgate, so Java and Bedrock
  players can play together. Installs the newest stable Paper build and
  the Java version it requires, verifies the download checksum and stores
  all data persistently in /share. The Minecraft EULA must be accepted
  explicitly in the add-on configuration.
version: "0.0.2"

arch:
  - amd64
  - aarch64

init: false
# Kein Host-Netzwerk (HA-Standard): nur die unten gelisteten Ports werden veröffentlicht

# Zeit zum sauberen Speichern der Welt beim Stoppen (Standard sind 10 s)
timeout: 60

# Nur die Ports, die gebraucht werden.
# Die Host-Ports können im HA UI geändert werden.
# Bedrock nutzt ab 26.60 NetherNet: TCP für das Signaling, UDP für das Spiel (beide 19132).
#
# Ports für Plugins: Home Assistant kann Ports nicht per Option öffnen, sie müssen hier vorab
# stehen. "null" heißt: im Container vorhanden, aber nicht veröffentlicht. Im Tab "Netzwerk"
# des Add-ons trägt man dazu einen Host-Port ein. Das Plugin muss auf dem hier genannten
# Container-Port lauschen (Beispiel Dynmap: 8123).
ports:
  25565/tcp: 25565
  19132/tcp: 19132
  19132/udp: 19132
  8123/tcp: null
  8100/tcp: null
  8804/tcp: null
  24454/udp: null
  25575/tcp: null
  25580/tcp: null
  25581/tcp: null
  25582/tcp: null
  25583/tcp: null
  25584/tcp: null
  25580/udp: null
  25581/udp: null
  25582/udp: null
  25583/udp: null
  25584/udp: null
ports_description:
  25565/tcp: "Minecraft Java Edition (TCP)"
  19132/tcp: "Minecraft Bedrock Edition via Geyser, Signaling (TCP)"
  19132/udp: "Minecraft Bedrock Edition via Geyser (UDP)"
  8123/tcp: "Plugin: Dynmap web map (TCP, off by default)"
  8100/tcp: "Plugin: BlueMap web map (TCP, off by default)"
  8804/tcp: "Plugin: Plan analytics (TCP, off by default)"
  24454/udp: "Plugin: Simple Voice Chat (UDP, off by default)"
  25575/tcp: "RCON remote console (TCP, off by default, only open it with a strong password)"
  25580/tcp: "Free for plugins (TCP, off by default)"
  25581/tcp: "Free for plugins (TCP, off by default)"
  25582/tcp: "Free for plugins (TCP, off by default)"
  25583/tcp: "Free for plugins (TCP, off by default)"
  25584/tcp: "Free for plugins (TCP, off by default)"
  25580/udp: "Free for plugins (UDP, off by default)"
  25581/udp: "Free for plugins (UDP, off by default)"
  25582/udp: "Free for plugins (UDP, off by default)"
  25583/udp: "Free for plugins (UDP, off by default)"
  25584/udp: "Free for plugins (UDP, off by default)"

map:
  - share:rw

options:
  data_dir: "/share/minecraft-paper"

  # Muss auf true gesetzt werden: https://aka.ms/MinecraftEULA
  accept_eula: false

  # RAM (MB)
  xms_mb: 1024
  xmx_mb: 4096

  # "latest" = neueste Version mit stabilem Paper-Build, oder z.B. "1.21.11"
  mc_version: "latest"

  # Auch Beta/Alpha-Builds zulassen (von PaperMC nicht supportet)
  allow_experimental: false

  # Geyser + Floodgate installieren (Bedrock-Spieler)
  bedrock_support: true

  # Bedrock-Spieler dürfen chatten (setzt enforce-secure-profile=false, nur mit Bedrock-Unterstützung)
  bedrock_chat: true

  # Geyser/Floodgate bei jedem Start auf die neueste Version aktualisieren
  update_plugins: true

  # Weitere Plugins: direkte https-Links auf .jar-Dateien
  plugin_urls: []

  # Spielerlisten, werden bei jedem Start mit dem Server abgeglichen
  # (Whitelist nur aktiv, wenn whitelist_enabled true ist)
  whitelist_enabled: false
  whitelist: []
  ops: []
  banned_players: []

  # Leistung
  # custom = server.properties bleibt unangetastet, sonst low, balanced oder high
  performance_profile: "custom"
  # normal, low oder lowest: niedrigere Priorität schont Home Assistant
  cpu_priority: "normal"
  # Anzahl der CPU-Kerne für den Server, 0 = alle
  cpu_cores: 0
  # xmx_mb automatisch begrenzen, damit RAM für System und Home Assistant bleibt
  memory_guard: true
  # Xms = Xmx und Heap sofort belegen
  fixed_heap: false

  # Spielwelt: 0 bzw. -1 lässt den Wert in server.properties unverändert und überschreibt das Leistungsprofil sonst
  view_distance: 0
  simulation_distance: 0
  max_players: 0
  entity_broadcast_range: 0

  # Spielerlebnis: "default" lässt den Wert in server.properties unverändert
  difficulty: "default"
  gamemode: "default"
  force_gamemode: "default"
  hardcore: "default"
  pvp: "default"
  allow_flight: "default"
  allow_nether: "default"
  spawn_monsters: "default"
  spawn_animals: "default"
  spawn_npcs: "default"
  generate_structures: "default"
  command_blocks: "default"
  spawn_protection: -1
  motd: ""
  # Gilt nur beim Erzeugen einer neuen Welt
  level_seed: ""

  # Spielregeln als name=wert, z. B. keep_inventory=true (siehe README)
  game_rules: []

schema:
  data_dir: str
  accept_eula: bool
  xms_mb: int
  xmx_mb: int
  mc_version: str
  allow_experimental: bool
  bedrock_support: bool
  bedrock_chat: bool
  update_plugins: bool
  plugin_urls:
    - url
  # Optional: Java-Version erzwingen (sonst aus den Paper-Metadaten)
  java_major: int(8,99)?
  whitelist_enabled: bool
  whitelist:
    - match(^\.?[A-Za-z0-9_]{1,16}$)
  ops:
    - match(^\.?[A-Za-z0-9_]{1,16}$)
  banned_players:
    - match(^\.?[A-Za-z0-9_]{1,16}$)
  performance_profile: list(custom|low|balanced|high)
  cpu_priority: list(normal|low|lowest)
  cpu_cores: int(0,64)
  memory_guard: bool
  fixed_heap: bool
  view_distance: int(0,32)
  simulation_distance: int(0,32)
  max_players: int(0,10000)
  entity_broadcast_range: int(0,500)
  difficulty: list(default|peaceful|easy|normal|hard)
  gamemode: list(default|survival|creative|adventure|spectator)
  force_gamemode: list(default|true|false)
  hardcore: list(default|true|false)
  pvp: list(default|true|false)
  allow_flight: list(default|true|false)
  allow_nether: list(default|true|false)
  spawn_monsters: list(default|true|false)
  spawn_animals: list(default|true|false)
  spawn_npcs: list(default|true|false)
  generate_structures: list(default|true|false)
  command_blocks: list(default|true|false)
  spawn_protection: int(-1,1000)
  motd: str?
  level_seed: str?
  game_rules:
    - match(^[A-Za-z0-9_:]{1,64}=(true|false|-?[0-9]{1,9})$)
